name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-python
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Actions are pinned by full commit SHA. The trailing comment records the
      # semver tag that SHA carried when it was verified against the upstream
      # repository. Never change the SHA and the comment independently.
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run smoke test
        run: python -m src.framework_demo health
